[project]
name = "django-news-pr-filter"
version = "0.1.0"
description = 'Drafts the "Updates to Django" section of the Django News newsletter.'
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
django-news-pr-filter = "django_news_pr_filter.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
